<section class="bg-parchment pb-24 pt-12">
  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <p class="text-xs font-semibold uppercase tracking-[0.22em] text-copper">Journeys</p>
    <h1 class="mt-2 font-display text-4xl font-semibold text-ink sm:text-6xl">Ziyarat from the UK</h1>
    <p class="mt-4 max-w-2xl text-muted">
      Each itinerary is scholar-led. Prices, flights and exact dates are confirmed when you enquire —
      groups and seasons change.
    </p>

    <div class="mt-10 flex flex-wrap gap-2">
      @for (filter of filters; track filter.id) {
        <button
          type="button"
          class="rounded-full border px-4 py-2 text-sm font-medium transition"
          [class]="
            selected() === filter.id
              ? 'border-midnight bg-midnight text-parchment'
              : 'border-stone bg-stone/40 text-ink hover:border-copper'
          "
          (click)="choose(filter.id)"
        >
          {{ filter.label }}
        </button>
      }
    </div>

    <div class="mt-12 grid gap-6 sm:grid-cols-2">
      @for (tour of tours(); track tour.slug; let i = $index) {
        <div [class]="i === 0 && selected() === 'all' ? 'sm:col-span-2' : ''">
          <app-trip-card [tour]="tour" [featured]="i === 0 && selected() === 'all'" />
        </div>
      }
    </div>
  </div>
</section>
