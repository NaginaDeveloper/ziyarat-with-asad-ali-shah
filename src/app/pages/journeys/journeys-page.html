<section class="bg-parchment pb-24 pt-12">
  <div class="mx-auto max-w-6xl px-5 sm:px-8">
    <p class="text-xs font-semibold uppercase tracking-[0.22em] text-copper">Archive</p>
    <h1 class="mt-2 font-display text-4xl font-semibold text-ink sm:text-6xl">Journeys on film</h1>
    <p class="mt-4 max-w-2xl text-muted">
      Films from the official channel — shrines, prophetic sites, and the adab of ziyarat. Watch here,
      then enquire if you wish to walk them in person.
    </p>
    <div class="mt-12 columns-1 gap-5 sm:columns-2 lg:columns-3">
      @for (film of films; track film.id) {
        <button
          type="button"
          class="mb-5 block w-full break-inside-avoid overflow-hidden rounded-2xl bg-midnight text-left text-parchment shadow-card"
          (click)="playing.set(film.id)"
        >
          <img [src]="thumb(film.id)" [alt]="film.title" class="aspect-video w-full object-cover" />
          <span class="block p-5">
            <span class="block text-xs uppercase tracking-wider text-copper">{{ film.place }}</span>
            <span class="mt-1 block font-display text-xl font-semibold">{{ film.title }}</span>
          </span>
        </button>
      }
    </div>
    <a
      [href]="org.youtubeUrl"
      target="_blank"
      rel="noopener noreferrer"
      class="mt-6 inline-flex text-sm font-semibold text-ink underline decoration-copper underline-offset-4"
    >
      Full channel on YouTube
    </a>
  </div>
</section>

<app-video-lightbox [videoId]="playing()" (closed)="playing.set(null)" />
