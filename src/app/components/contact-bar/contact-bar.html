<div
  class="fixed inset-x-0 bottom-0 z-40 border-t border-stone bg-parchment/95 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] backdrop-blur-xl md:hidden"
>
  <div class="grid grid-cols-2 gap-2">
    <a
      [href]="chat"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center justify-center gap-2 rounded-xl bg-whatsapp px-3 py-3 text-sm font-semibold text-white"
    >
      <app-whatsapp-icon [size]="20" />
      WhatsApp
    </a>
    <a
      routerLink="/enquire"
      class="inline-flex items-center justify-center rounded-xl bg-midnight px-3 py-3 text-sm font-semibold text-parchment"
    >
      Enquire
    </a>
  </div>
</div>
