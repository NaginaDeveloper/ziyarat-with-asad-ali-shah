<ol class="relative space-y-0">
  @for (stop of stops(); track stop.place; let i = $index; let last = $last) {
    <li class="relative grid grid-cols-[2.5rem_1fr] gap-4 pb-8 last:pb-0">
      <div class="relative flex flex-col items-center">
        <span
          class="relative z-10 flex h-10 w-10 items-center justify-center rounded-full bg-midnight font-display text-sm font-semibold text-parchment"
        >
          {{ i + 1 }}
        </span>
        @if (!last) {
          <span class="absolute top-10 bottom-0 w-px bg-stone" aria-hidden="true"></span>
        }
      </div>
      <div class="rounded-xl border border-stone bg-parchment px-5 py-4">
        <p class="font-display text-xl font-semibold text-ink">{{ stop.place }}</p>
        <p class="mt-1 text-sm leading-relaxed text-muted">{{ stop.note }}</p>
      </div>
    </li>
  }
</ol>
