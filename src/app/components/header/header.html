<header class="sticky top-0 z-50 border-b border-gold/20 bg-forest/96 text-cream backdrop-blur-xl">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-3 sm:px-8">
    <a routerLink="/" (click)="close()" class="flex min-w-0 items-center gap-3">
      <img
        src="brand/logo.png"
        alt=""
        width="44"
        height="44"
        class="h-11 w-11 rounded-full bg-cream object-cover ring-1 ring-gold/40"
      />
      <span class="min-w-0">
        <span class="block truncate font-display text-lg font-semibold leading-tight sm:text-xl">
          Ziyarat with Asad Ali Shah
        </span>
        <span class="hidden text-[0.65rem] uppercase tracking-[0.18em] text-gold-300/80 sm:block">
          Sacred travel from the UK
        </span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-gold-300"
          class="rounded-full px-4 py-2 text-sm font-medium text-cream/85 transition hover:bg-white/8 hover:text-gold-300"
        >
          {{ link.label }}
        </a>
      }
      <a
        routerLink="/enquire"
        class="ml-2 rounded-full bg-gold px-4 py-2 text-sm font-semibold text-forest transition hover:bg-gold-300"
      >
        Book a journey
      </a>
    </nav>

    <button
      type="button"
      class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-cream/20 md:hidden"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      aria-controls="mobile-nav"
      [attr.aria-label]="open() ? 'Close menu' : 'Open menu'"
    >
      @if (open()) {
        <span class="text-lg" aria-hidden="true">×</span>
      } @else {
        <span class="flex flex-col gap-1.5" aria-hidden="true">
          <span class="block h-0.5 w-5 bg-cream"></span>
          <span class="block h-0.5 w-5 bg-cream"></span>
          <span class="block h-0.5 w-4 bg-cream"></span>
        </span>
      }
    </button>
  </div>

  @if (open()) {
    <nav
      id="mobile-nav"
      class="border-t border-gold/15 px-5 py-4 md:hidden"
      aria-label="Mobile"
    >
      <div class="flex flex-col gap-1">
        @for (link of links; track link.path) {
          <a
            [routerLink]="link.path"
            (click)="close()"
            class="rounded-xl px-3 py-3 text-base font-medium text-cream/90"
          >
            {{ link.label }}
          </a>
        }
      </div>
    </nav>
  }
</header>
